# IN ORDER TO USE THIS CONFIG FILE, RENAME IT AND REMOVE THE ".example" PART OF THE FILENAME!
#
# CrewLink peer to peer connection configuration.
#
# This file lets you modify how CrewLink connects players to each other.
#
# CrewLink uses peer to peer connections to establish voice calls between players. This means that every player has to
# be able to connect to every other player some way or another in order for CrewLink to work. Below you can tweak the
# mechanisms CrewLink uses to establish peer to peer connections.

# Force CrewLink to only work through TURN servers. This is great if you want to protect the IP addresses of players
# as no direct connection will be made. At least one TURN server is required if set to true.
# Can also be set with the FORCE_RELAY_ONLY environment variable, which takes precedence
# and is the only way to reach this setting in a container deployment.
forceRelayOnly: false

# Settings for the built-in TURN server.
integratedRelay:
  # Leave this false if you use a managed TURN provider (see CF_TURN_KEY_ID in the README).
  # Enabling it requires HOSTNAME to be set and the UDP ports below reachable directly on the host --
  # a reverse proxy cannot forward TURN, because relay ports are allocated dynamically.
  enabled: true # Use the-built in relay server if you run a small-scale server for private use.
  #relayIps: ['192.0.2.1']
  #listeningIps: ['192.0.2.1']
  #externalIps: { 'default': '192.0.2.1' }
  # One UDP port is used per active relay allocation. The old 49152-65535 range
  # was 16383 ports, which under Docker bridge networking spawns a docker-proxy
  # process per published port. Widen this only if you actually run out.
  minPort: 49152
  maxPort: 50152
  listeningPort: 3478
  # Can be one of: OFF, FATAL, ERROR, WARN, INFO, DEBUG, TRACE, ALL
  # Keep at ERROR in production: the relay logs per-packet at the chattier levels.
  debugLevel: 'ERROR'
  defaultUsername: 'M9DRVaByiujoXeuYAAAG'
  defaultPassword: 'TpHR9HQNZ8taxjb3'
# The integrated relay is a pure-JS TURN server that runs *inside* the signaling event loop, so every relayed
# media packet competes with signaling callbacks. Opus at 20ms framing is ~100 packets/sec per relayed link, so
# this becomes the dominant CPU cost well before the signaling code does. For anything beyond small private use,
# set enabled: false above and run a native TURN server (coturn) as a separate process, then list it under
# iceServers below. Clients pick this up automatically from clientPeerConfig at connect time -- no client change.

# Custom TURN/STUN servers
iceServers:
  # Google's STUN server is used by default
  - urls: 'stun:stun.l.google.com:19302'
#   - urls: 'turn:example.com'
#     username: 'TurnUsername'
#     credential: 'TurnPassword'
#   - urls: 'stun:example.com'
#     username: 'StunUsername'
#     credential: 'StunPassword'